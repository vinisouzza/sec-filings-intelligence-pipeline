name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-and-validate:
    name: Python Tests and dbt Validation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify package installation
        run: |
          python -c "import bronze"
          python -c "import silver"
          python -c "import ingestion"

      - name: Run Pytest
        run: |
          pytest -v

      - name: Validate dbt project
        run: |
          dbt parse \
            --project-dir dbt \
            --profiles-dir dbt