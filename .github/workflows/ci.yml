name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Python Tests and dbt Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SEC_USER_AGENT: "sec-filings-intelligence-pipeline GitHub Actions (contact: your-email@example.com)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify package installation
        run: |
          python -c "import ingestion"
          python -c "import bronze"
          python -c "import silver"

      - name: Run Pytest
        run: pytest -v -m "not integration"

      - name: Validate dbt project
        run: |
          dbt parse \
            --project-dir dbt \
            --profiles-dir dbt