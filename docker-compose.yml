services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:

    build:
      context: .
      dockerfile: airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      PYTHONPATH: /opt/project/src

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "

  airflow-webserver:

    build:
      context: .
      dockerfile: airflow/Dockerfile

    depends_on:
      - airflow-init

    restart: always

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      PYTHONPATH: /opt/project/src

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/project/src
      - ./dbt:/opt/project/dbt
      - ./data:/opt/project/data

    command: webserver

  airflow-scheduler:

    build:
      context: .
      dockerfile: airflow/Dockerfile

    depends_on:
      - airflow-init

    restart: always

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      PYTHONPATH: /opt/project/src

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/project/src
      - ./dbt:/opt/project/dbt
      - ./data:/opt/project/data

    command: scheduler